# Rust integration tests and llvm-cov settings (invoked via pnpm test:rust / test:rust:coverage).
# Run from the repository root.
# Requires cargo-nextest: https://nexte.st/book/installing.html (e.g. cargo install cargo-nextest).

[alias]
sqllumen-test-integration = [
  "nextest",
  "run",
  "--manifest-path",
  "src-tauri/Cargo.toml",
  "--features",
  "test-utils",
  "--test",
  "integration",
]

sqllumen-llvm-cov = [
  "llvm-cov",
  "nextest",
  "--no-clean",
  "--summary-only",
  "--ignore-filename-regex",
  "src-tauri.*src.*credentials\\.rs|src-tauri.*src.*main\\.rs|src-tauri.*tests.*common|cargo.*registry|src-tauri.*src.*commands.export\\.rs|src-tauri.*src.*export.xlsx_writer\\.rs|src-tauri.*src.*mysql.query_log\\.rs|src-tauri.*src.*commands.sql_dump\\.rs|src-tauri.*src.*commands.copy_to_host\\.rs|src-tauri.*src.*export.sql_import\\.rs|src-tauri.*src.*commands.ai_memory\\.rs|src-tauri.*src.*ai_memory.search\\.rs|src-tauri.*src.*ai_memory.reembed\\.rs",
  "--manifest-path",
  "src-tauri/Cargo.toml",
  "--features",
  "test-utils",
  "--test",
  "integration",
  "--fail-under-lines",
  "90",
  "--fail-under-functions",
  "90",
  "--fail-under-regions",
  "90",
]
