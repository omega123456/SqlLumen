[package]
name = "sqllumen"
version = "2.15.4"
edition = "2021"

[lib]
name = "sqllumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["dialog"]
dialog = ["dep:tauri-plugin-dialog"]
test-utils = []

# Version pins use tilde (~major.minor.patch) so only patch updates resolve without an
# explicit Cargo.toml edit. Cargo.lock + `cargo build/test --locked` (CI and release) are the
# hard enforcement; these requirements bound what `cargo update`/new deps may pull in.
[build-dependencies]
tauri-build = { version = "~2.6.2", features = [] }

[dependencies]
tauri = { version = "~2.11.2", features = ["devtools"] }
tauri-plugin-dialog = { version = "~2.7.1", optional = true }
tauri-plugin-clipboard-manager = "~2.3.2"
tauri-plugin-prevent-default = "~4.0.4"
serde = { version = "~1.0.228", features = ["derive", "rc"] }
serde_json = "~1.0.150"
csv = "~1.4.0"
rusqlite = { version = "~0.32.1", features = ["bundled"] }
refinery = { version = "~0.9.1", default-features = false, features = ["rusqlite"] }
uuid = { version = "~1.23.2", features = ["v4", "serde"] }
regex = { version = "~1.12.3", features = ["std"] }
sqlparser = "~0.59.0"
sqlx = { version = "~0.8.6", features = ["runtime-tokio", "mysql", "tls-rustls-ring", "chrono"] }
tokio = { version = "~1.52.3", features = ["sync", "time", "macros", "rt"] }
rust_xlsxwriter = "~0.80.0"
base64 = "~0.22.1"
futures = "~0.3.32"
reqwest = { version = "~0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
mysql_async = { version = "~0.36.2", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
tokio-util = { version = "~0.7.18", features = ["rt"] }
tracing = "~0.1.44"
tracing-subscriber = { version = "~0.3.23", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "~0.2.5"
chrono = { version = "~0.4.44", default-features = false, features = ["clock", "std"] }
tauri-plugin-mcp-bridge = "~0.10.0"
tauri-plugin-os = "~2.3.2"
tauri-plugin-process = "~2.3.1"
tauri-plugin-updater = "~2.10.1"
tauri-plugin-window-state = "~2.4.1"
sqlite-vec = "~0.1.9"
sha2 = "~0.10.9"
hex = "~0.4.3"
moka = { version = "~0.12.15", features = ["sync"] }
sysinfo = "~0.31.4"
rmp-serde = "~1.3.1"
# Pin below 2.12: bitflags 2.12's __bitflags_flag_name! macro hits rustc's recursion limit when
# expanding dispatch2's large generated bitflags blocks (macOS release builds).
bitflags = "~2.11.1"

# keyring v3 has no default features — without these, the mock backend is used (no OS persistence).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "~3.6.3", features = ["windows-native"] }
tauri-plugin-prevent-default = { version = "~4.0.4", features = ["platform-windows"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "~3.6.3", features = ["apple-native"] }
# Used to read Mach VM statistics directly; sysinfo's available_memory()
# undercounts reclaimable (inactive) pages on macOS.
libc = "~0.2.186"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "~3.6.3", features = [
  "linux-native-sync-persistent",
  "sync-secret-service",
  "crypto-rust",
] }

[dev-dependencies]
tokio = { version = "~1.52.3", features = ["rt", "macros", "time", "test-util"] }
tauri = { version = "~2.11.2", features = ["test"] }
tempfile = "~3.27.0"
rmp-serde = "~1.3.1"
async-trait = "~0.1.89"
opensrv-mysql = "~0.7.0"
wiremock = "~0.6.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
