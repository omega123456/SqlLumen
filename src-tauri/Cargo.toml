[package]
name = "sqllumen"
version = "4.7.0"
edition = "2024"

[lib]
name = "sqllumen_lib"
crate-type = ["rlib"]
test = false

[features]
default = ["dialog"]
dialog = ["dep:tauri-plugin-dialog"]
test-utils = []

# Version pins use tilde (~major.minor.patch) so only patch updates resolve without an
# explicit Cargo.toml edit. Cargo.lock + `cargo build/test --locked` (CI and release) are the
# hard enforcement; these requirements bound what `cargo update`/new deps may pull in.
[build-dependencies]
tauri-build = { version = "~2.7.3", features = [] }

[dependencies]
tauri = { version = "~2.12.4", features = [] }
tauri-plugin-dialog = { version = "~2.8.3", optional = true }
tauri-plugin-clipboard-manager = "~2.5.0"
tauri-plugin-prevent-default = "~6.0.1"
serde = { version = "~1.0.229", features = ["derive", "rc"] }
serde_json = "~1.0.154"
csv = "~1.4.0"
rusqlite = { version = "~0.39.0", features = ["bundled"] }
refinery = { version = "~0.10.0", default-features = false, features = ["rusqlite"] }
uuid = { version = "~1.28.0", features = ["v4", "serde"] }
regex = { version = "~1.13.1", features = ["std"] }
sqlparser = "~0.63.0"
tokio = { version = "~1.54.0", features = ["sync", "time", "macros", "rt"] }
rust_xlsxwriter = { version = "~0.100.0", features = ["constant_memory"] }
base64 = "~0.23.1"
futures = "~0.3.34"
reqwest = { version = "~0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "~0.23.46", default-features = false, features = ["ring", "std"] }
mysql_async = { git = "https://github.com/blackbeam/mysql_async", rev = "d7525dcb1d35f3d60101a2e95e84171c3d3ac4a5", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
jiff = { version = "~1.0.0", default-features = false, features = ["std"] }
tokio-util = { version = "~0.7.20", features = ["rt"] }
tracing = "~0.1.44"
tracing-subscriber = { version = "~0.3.23", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "~0.2.5"
tauri-plugin-mcp-bridge = "~0.13.1"
tauri-plugin-os = "~2.4.0"
tauri-plugin-process = "~2.4.0"
tauri-plugin-updater = "~2.14.0"
tauri-plugin-window-state = "~2.5.0"
sqlite-vec = "~0.1.9"
sha2 = "~0.11.1"
hex = "~0.4.3"
moka = { version = "~0.12.16", features = ["sync"] }
sysinfo = "~0.39.6"
rmp-serde = "~1.3.1"

# keyring 4 moved to keyring-core + per-platform store crates; stay on v3 until existing
# keychain entries are verified readable through the new stores.
# keyring v3 has no default features — without these, the mock backend is used (no OS persistence).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "~3.6.3", features = ["windows-native"] }
tauri-plugin-prevent-default = { version = "~6.0.1", features = ["platform-windows"] }
# Turns on ANSI colour processing for the console the debug build logs to.
nu-ansi-term = "~0.50.3"
# Window chrome: reads the Windows build number to decide on Mica.
windows-version = "~0.1.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "~3.6.3", features = ["apple-native"] }
# Used to read Mach VM statistics directly; sysinfo's available_memory()
# undercounts reclaimable (inactive) pages on macOS.
libc = "~0.2.191"
mach2 = "~0.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "~3.6.3", features = [
  "linux-native-sync-persistent",
  "sync-secret-service",
  "crypto-rust",
] }

[dev-dependencies]
tokio = { version = "~1.54.0", features = ["rt", "macros", "time", "test-util"] }
tauri = { version = "~2.12.4", features = ["test"] }
tempfile = "~3.27.0"
rmp-serde = "~1.3.1"
async-trait = "~0.1.92"
opensrv-mysql = "~0.7.0"
opensrv-rustls = { package = "rustls", version = "~0.22.4", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "~1.15.1", features = ["std"] }
wiremock = "~0.6.5"
zip = { version = "~9.0.5", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.clippy]
excessive_nesting = "warn"
too_many_lines = "warn"
allow_attributes = "deny"
