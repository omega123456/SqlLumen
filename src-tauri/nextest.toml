# cargo-nextest config (workspace root for this crate).
# https://nexte.st/book/configuration.html

[profile.default]
# The repo-root `.cargo/config.toml` aliases select the single `integration` test binary.
# Selecting it explicitly avoids building or listing unrelated Cargo targets.
# Integration tests may block on I/O or DB; avoid false “hung test” kills.
slow-timeout = { period = "120s", terminate-after = 2 }
# End-of-run summary: list slow tests alongside pass/fail totals.
final-status-level = "slow"
